name: Simple CI # Name of the workflow
on:
  push: # On every push on any branch
jobs:
  Build: # Job name
    runs-on: ubuntu-latest # Operating system selection
    steps:
      - name: Checkout # custom name Checkout the repository
        uses: actions/checkout@v2 # Action implemented in this repository, tag "2"
      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.1 # Action implemented in repository "joschi/setup-jdk" tag "2.3.0"
        with: # Actions parameters (action name omitted)
          distribution: 'temurin' # JDK distribution
          java-version: 21
      - name: Build
        run: ./gradlew check